# ===================================================================
# CampusFind - Spring Boot Application Properties
# ===================================================================
server.port=8080

# Application Name
spring.application.name=campusfind-backend

# MySQL Database Configuration
# Host: localhost, Port: 3306, Database: campusfind_db
# Password is read securely from the DB_PASSWORD environment variable
spring.datasource.url=jdbc:mysql://localhost:3306/campusfind_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Multipart File Upload Settings (Max 5MB for photo uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Configurable Upload Directory for local photo storage
file.upload-dir=./uploads/images

# Logging configuration
logging.level.com.campusfind=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
